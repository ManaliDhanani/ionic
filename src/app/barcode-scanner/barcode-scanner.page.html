<ion-header [translucent]="true" id="header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Barcode Scanner</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [style.visibility]="content_visibility">
  <ion-card class="ion-text-center">
    <ion-card-header>
      QR Code
    </ion-card-header>
    <ion-card-content>
      <qrcode 
        [qrdata]="qrCodeString" 
        [width]="256" 
        [errorCorrectionLevel]="'M'">
      </qrcode>
      <div class="scanned-result-overlay" *ngIf="scannedResult && isUrl(scannedResult)">
        <a href="{{scannedResult}}" class="scanned-link">
          {{scannedResult}}
        </a>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-card class="ion-text-center">
    <ion-card-header>
      Bar Code
    </ion-card-header>
    <ion-card-content>
      <img id="barcode"/>
    </ion-card-content>
  </ion-card>

  <ion-item *ngIf="scannedResult && !isUrl(scannedResult)">
    <ion-label>
      Barcode result: {{scannedResult}}
    </ion-label>
  </ion-item>

  <ion-button 
    expand="block" 
    class="ion-margin" 
    (click)="startScan()">
    Scan
  </ion-button>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-tabs>
      <ion-tab-bar slot="bottom">
        <ion-tab-button [routerLink]="['/home']">
          <ion-icon name="home"></ion-icon>
          Home
        </ion-tab-button>
        <ion-tab-button [routerLink]="['/photo-gallery']">
          <ion-icon name="camera"></ion-icon>
          Camera
        </ion-tab-button>
        <ion-tab-button [routerLink]="['/calendar']">
          <ion-icon name="calendar"></ion-icon>
          Calendar
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ion-toolbar> 
</ion-footer>
